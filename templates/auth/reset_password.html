{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔒</span>
            <h2>Set New Password</h2>
            <p>Create a secure password for your account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="needs-validation" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Min 8 chars, 1 uppercase, 1 digit" required minlength="8">
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Re-enter new password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-cyber w-100 mb-3">
                <i class="bi bi-shield-check me-2"></i>Update Password
            </button>

            <div class="text-center">
                <a href="{{ url_for('auth.login') }}">Back to Sign In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
